# Cloudflare Pages — 與 Dashboard 專案 pauls-experimental-lab 相同名稱（更新同一專案）
# Build: npm run build  →  output: dist
name = "pauls-experimental-lab"
compatibility_date = "2026-07-13"
pages_build_output_dir = "dist"

# Production D1 binding. Keep the binding name exactly DB.
[[d1_databases]]
binding = "DB"
database_name = "pauls-portfolio-cms"
database_id = "42782945-2397-4db8-b4cf-7a2216775de7"

# R2 upload provider. The public delivery URL remains a Pages environment
# variable so the custom media domain can be changed without source edits.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pauls-portfolio-media"

[vars]
ASSET_PROVIDER = "r2"
# Public delivery host only; no credentials are exposed to the browser.
R2_PUBLIC_BASE_URL = "https://media.paul-lab.com"
# Defence in depth: the API independently checks the email injected by
# Cloudflare Access. This is not a browser-exposed secret.
ADMIN_ALLOWED_EMAILS = "yangpboy@gmail.com"
# Access injects a signed JWT on protected requests. The API verifies its
# signature and audience before trusting the email claim.
CF_ACCESS_TEAM_DOMAIN = "https://crimson-dream-8c23.cloudflareaccess.com"
CF_ACCESS_AUD = "6b349295703cc43d5242bb566569bea9ce8ea0a58d1e42f5a490bc34ec42548f"
